 viper:['Military sniper school barracks in winter, in a fitted thermal top and fatigues, lying on a bunk sharing a blanket edge with an unseen spotter, quiet smile, breath visible','Snow range at dusk, prone beside a second rifle, glancing sideways with a teasing look, cheeks red from cold','Empty barracks room, one bunk stripped bare, she sits holding two sets of dog tags, hair falling over one eye'],
 glitch:['Age 20, basement server room under a nightclub, oversized band tee and shorts, sitting among cables with a laptop, lollipop, bass lights leaking through the ceiling','Same basement, late night, leaning back against an unseen partner shoulder while both type, laughing, teal screen glow on bare legs','Dawn on a fire escape, burning a paper ID card with a lighter, glasses pushed up, eyes wet but smiling'],
 brick:['Underground fight ring, champion pose in sports wrap and shorts, sweat and tape on her fists, roaring crowd blurred, huge grin','Locker room after a fight, sitting on a bench with a towel around her neck while unseen hands tape her knuckles, shy look she rarely shows','Empty ring after closing, lying on the canvas staring up, a single championship belt beside her, soft tired smile'],
 mirage:['First undercover job as a casino dealer, fitted waistcoat and bow tie, dealing cards with a practiced smile, gold light','Hotel balcony at night in a silk slip and a man jacket over her shoulders, champagne glass, looking back into the room with a real smile','Train platform at dawn, wig in her hand and makeup half removed, watching a train leave, unreadable face'],
 doc:['Field hospital night shift, rolled-sleeve scrubs under a white coat, tattoo sleeve half done, checking an IV by lamp light, warm focused face','Supply tent at night, sitting on a crate in a tank top while an unseen person bandages her hand, teasing smile, lantern light','Morning outside the tent, coat folded over her arm, an empty cot behind her, looking at a transfer order']};
var SETS={
 full:function(id,c){var j=c.cuts.map(function(u,i){return {name:id+'_'+(i+1),t:(i+1)+'. '+u[0],s:u[1],size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\n'+u[2]};});
  j.push({name:id+'_end',t:'엔딩 컷',s:'스토리 "그날 밤" 마지막 장면',size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\n'+c.end});
  j.push({name:'s_'+id,t:'게임 내 스프라이트',s:'4×4 (방향 4 × 포즈 4)',size:'1024x1024',sq:true,spr:true,prompt:SPR.replace('ACCENT',c.acc)+c.rows+'\n\n'+c.d});return j;},
 personal:function(id,c){var L=[['침대 위 란제리','Bedroom at night, minimal lace lingerie set in her accent color, kneeling on the bed and looking back over her shoulder, three-quarter back view, inviting half smile, warm lamp light.'],['아침 셔츠 한 장','Morning kitchen, wearing only an oversized white shirt buttoned low, sitting on the counter with a coffee mug, legs crossed, sleepy smile, low angle, sunlight through blinds.'],['샤워 후 타월','Steamy bathroom, wrapped in a white towel, wet hair, wiping the mirror with one hand and meeting the viewer in the reflection, over-the-shoulder shot.'],['수영장 비키니','Night pool, small bikini in her accent color, climbing out of the water toward the camera, water running off her skin, confident stare, low angle from the pool edge.'],['스타킹과 가터','Dim lounge, black bodysuit with stockings and garter straps, reclining in an armchair with one leg over the armrest, top-down angle, smoldering look.'],['등 파인 드레스','Hotel hallway, backless evening dress in her accent color, unlocking a room door and glancing back at the viewer, side view, playful challenge in her eyes.']];
  return L.map(function(u,i){return {name:id+'_p'+(i+1),t:'P'+(i+1)+'. '+u[0],s:'개인 미션용',size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\n'+u[1]+SAFE};});},
 kv:function(id,c){return [{name:'kv_main_'+id,t:'메인 미션 키비주얼',s:'가로 3:2',size:'1536x1024',sq:true,prompt:KVC+'\n\n'+c.d+'\n\nSpecial mission combat suit. Scene: '+MAIN[id]+'.'},{name:'kv_winter_'+id,t:'블러디 크리스마스 키비주얼',s:'가로 3:2',size:'1536x1024',sq:true,prompt:KVC+'\n\n'+c.d+'\n\nWinter combat suit with a fur-trimmed hood and her accent color, falling snow, cold blue night with red Christmas lights. Scene: '+WINTERKV[id]+'.'},{name:'kv_prequel_'+id,t:'프리퀄 키비주얼',s:'가로 3:2',size:'1536x1024',sq:true,prompt:KVC+'\n\n'+c.d+'\n\nShe is a few years younger, an adult in her early 20s. '+PRE[id][0]+SAFE}];},
 winter:function(id,c){var L=[['겨울 전투복','Winter special-ops suit with a fur-trimmed hood and accent-color piping, standing in falling snow at night, breath visible, low angle hero shot, red Christmas lights behind.'],['산타 착장','Short red velvet Santa-style dress with white fur trim, black thigh-high boots, sitting on a gift-wrapped crate with a suppressed pistol resting on her knee, playful wink, warm fairy lights.'],['눈 속 니트','Off-shoulder oversized knit sweater and thigh-high socks, sitting by a frosted window with a mug, snow outside, soft smile, eye-level close shot.']];
  return L.map(function(u,i){return {name:id+'_w'+(i+1),t:'W'+(i+1)+'. '+u[0],s:'시즈널 겨울',size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\n'+u[1]+SAFE};});},
 costume:function(id,c){var L=[['해변 수영복','Tropical beach at sunset, stylish swimsuit in her accent color with a sheer cover-up, walking out of the surf, wind in her hair, confident smile, low angle.'],['차이나 드레스','High-slit cheongsam in black with accent-color embroidery, leaning on a red lacquered railing with a folding fan, sidelong look, lantern light.'],['라이더 수트','Tight leather biker suit unzipped to the collarbone, sitting sideways on a motorcycle at night, helmet under her arm, neon reflections on wet asphalt.'],['유카타','Loosely tied yukata in her accent color slipping off one shoulder, summer festival at night with fireworks, looking back with a smile, three-quarter back view.']];
  return L.map(function(u,i){return {name:id+'_c'+(i+1),t:'C'+(i+1)+'. '+u[0],s:'코스튬',size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\n'+u[1]+SAFE};});},
 prequel:function(id,c){return PRE[id].map(function(u,i){return {name:id+'_q'+(i+1),t:'Q'+(i+1)+'. 프리퀄 장면',s:'식스가 되기 전',size:'1024x1536',prompt:COMMON+'\n\n'+c.d+'\n\nShe is a few years younger, an adult in her early 20s, with the same face. '+u+SAFE};});},
 map:function(){var T=[['winter','겨울 — 눈 쌓인 밤','heavy snow covering roofs, crates and ground, footprints, icicles, cold blue moonlight with a few warm lamps, light snowfall'],['rain','비 오는 밤','rain-soaked ground with reflections and puddles, wet surfaces, dim sodium lamps, mist'],['dusk','해 질 녘','low orange sunset light with long shadows, warm rim light on walls, dust in the air'],['fog','새벽 안개','pale dawn fog, desaturated colors, soft diffuse light, damp ground']];
  return T.map(function(u){return {name:'map_'+u[0],dir:'maps',t:'맵 — '+u[1],s:'가로 3:2 · 참고 맵과 같은 배치',size:'1536x1024',sq:true,map:true,prompt:'Repaint the attached top-down isometric game map as the same place in a different condition: '+u[2]+'. Keep the camera angle, the layout and the exact position, size and outline of every wall, building, crate, road and object identical to the reference so the image can be overlaid on the original collision grid. Painted hyper-detailed isometric game background, no characters, no text, no UI, no grid lines.'};});}
};
function build(){
  var id=$('char').value,c=C[id],set=$('set').value;document.documentElement.style.setProperty('--c',c.col);
  jobs=SETS[set](id,c).map(function(j){j.dir=j.dir||id;j.on=true;j.st='';j.msg='';return j;});
  $('char').disabled=set==='map';
  fetch('/api/list').then(function(r){return r.json();}).then(function(d){$('outp').textContent=d.out;jobs.forEach(function(j){var have=d.files[j.dir]||[];if(have.indexOf(j.name)>=0){j.st='ok';j.msg='이미 있음';j.file='/out/'+j.dir+'/'+j.name+'.png?t='+Date.now();j.on=false;}});draw();}).catch(draw);
}
function draw(){
  $('jobs').innerHTML=jobs.map(function(j,i){return '<div class="job'+(j.sq?' sq':'')+(j.ed?' ed':'')+'"><div class="th" style="'+(j.file?'background-image:url('+j.file+')':'')+'">'+(j.file?'':j.st==='run'?'생성 중…':'아직 없음')+'</div><div class="bd"><h3><input type="checkbox" data-i="'+i+'" '+(j.on?'checked':'')+'>'+j.t+'</h3><p>'+j.s+'</p><div class="st '+j.st+'">'+(j.st==='run'?'생성 중…':j.msg||j.name+'.png')+'</div><div class="ac"><button data-r="'+i+'"'+(j.st==='run'?' disabled':'')+'>'+(j.file?'다시 뽑기':'뽑기')+'</button><button data-e="'+i+'">프롬프트</button></div><textarea data-p="'+i+'">'+j.prompt.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></div></div>';}).join('');
  var n=jobs.filter(function(j){return j.st==='ok';}).length;$('sum').textContent=($('set').value==='map'?'맵':C[$('char').value].n)+' — '+n+' / '+jobs.length+'컷 완료'+(running?' · 생성 중 '+running+'건':'');
}
$('jobs').addEventListener('click',function(e){var t=e.target,d=t.dataset;if(d.r!==undefined){enq([+d.r]);}else if(d.e!==undefined){jobs[+d.e].ed=!jobs[+d.e].ed;draw();}});
$('jobs').addEventListener('change',function(e){var d=e.target.dataset;if(d.i!==undefined)jobs[+d.i].on=e.target.checked;if(d.p!==undefined)jobs[+d.p].prompt=e.target.value;});
function enq(list){
  if(!$('key').value.trim()){alert('API 키를 넣어 주세요.');return;}
  if(!refs.length&&!confirm('참고 이미지가 없습니다. 얼굴이 기존 캐릭터와 달라질 수 있어요. 그대로 진행할까요?'))return;
  ls('s6key',$('key').value.trim());ls('s6model',$('model').value.trim());ls('s6q',$('quality').value);
  list.forEach(function(i){var j=jobs[i];if(j.st!=='run'&&queue.indexOf(j)<0){j.st='run';j.msg='';queue.push(j);}});draw();pump();
}
function pump(){
  var max=+$('conc').value;
  while(running<max&&queue.length){(function(j){running++;
    var body={key:$('key').value.trim(),model:$('model').value.trim(),quality:$('quality').value,size:j.size,prompt:j.prompt,char:j.dir,name:j.name,refs:j.spr?refs.slice(0,2).concat(sref):j.map?refs.slice(0,1):refs};
    if(j.spr&&$('sbg').value)body.background=$('sbg').value;
    var fin=function(d){if(d.ok){j.st='ok';j.msg='저장됨';j.file=d.file;j.on=false;}else{j.st='err';j.msg=d.error;}running--;draw();pump();},t0=Date.now(),miss=0;
    var poll=function(id){setTimeout(function(){fetch('/api/job?id='+id).then(function(r){return r.json();}).then(function(d){miss=0;if(d.done)fin(d);else{j.msg='생성 중… '+Math.round((Date.now()-t0)/1000)+'초';var e=document.querySelector('[data-r="'+jobs.indexOf(j)+'"]');if(e&&e.parentNode.previousElementSibling)e.parentNode.previousElementSibling.textContent=j.msg;poll(id);}}).catch(function(e){if(++miss<5)poll(id);else fin({ok:false,error:'프로그램과 연결이 끊겼다. 터미널 창이 켜져 있는지 확인해 주세요.'});});},2000);};
    fetch('/api/gen',{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){if(d.job)poll(d.job);else fin(d);}).catch(function(e){fin({ok:false,error:location.protocol==='file:'?'studio.html을 직접 열면 안 된다. "SILENT6 Studio.command"로 실행해 주세요.':'프로그램과 연결이 안 된다. 터미널 창이 켜져 있는지 확인해 주세요. ('+e+')'});});
  })(queue.shift());}
  draw();
}
function addFiles(fs,arr,box,one){[].forEach.call(fs,function(f){var r=new FileReader();r.onload=function(){if(one)arr.length=0;arr.push(r.result);showRefs(arr,box);};r.readAsDataURL(f);});}
function showRefs(arr,box){$(box).innerHTML=arr.map(function(u,i){return '<div><img src="'+u+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px"><b data-x="'+i+'">×</b></div>';}).join('');}
[['drop','file',refs,'refs',false],['drop2','file2',sref,'refs2',true]].forEach(function(a){
  var dz=$(a[0]),fi=$(a[1]);dz.onclick=function(){fi.click();};fi.onchange=function(){addFiles(fi.files,a[2],a[3],a[4]);fi.value='';};
  dz.ondragover=function(e){e.preventDefault();dz.className='on';};dz.ondragleave=function(){dz.className='';};dz.ondrop=function(e){e.preventDefault();dz.className='';addFiles(e.dataTransfer.files,a[2],a[3],a[4]);};
  $(a[3]).onclick=function(e){var x=e.target.dataset.x;if(x!==undefined){a[2].splice(+x,1);showRefs(a[2],a[3]);}};
});
$('go').onclick=function(){var l=[];jobs.forEach(function(j,i){if(j.on)l.push(i);});if(!l.length){alert('뽑을 컷을 선택해 주세요.');return;}enq(l);};
$('all').onclick=function(){jobs.forEach(function(j){j.on=true;});draw();};$('none').onclick=function(){jobs.forEach(function(j){j.on=false;});draw();};
$('open').onclick=function(){fetch('/api/open',{method:'POST',body:'{}'});};
$('zip').onclick=function(){fetch('/api/zip',{method:'POST',body:JSON.stringify({char:$('set').value==='map'?'maps':$('char').value})}).then(function(r){return r.json();}).then(function(d){alert('ZIP 저장: '+d.path);});};
$('char').onchange=function(){refs.length=0;showRefs(refs,'refs');build();};$('set').onchange=function(){if($('set').value==='map'||refs.length&&confirm('참고 이미지를 비울까요?')){refs.length=0;showRefs(refs,'refs');}build();};
build();
</script></body></html>
