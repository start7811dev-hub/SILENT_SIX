<style>
:root{--bg:#0b0e13;--pn:#141a22;--ln:#263040;--ink:#e9edf2;--mu:#8a96a3;--c:#ff3b52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--ln);display:flex;align-items:baseline;gap:14px}
h1{margin:0;font-size:20px;letter-spacing:.04em}h1 b{color:var(--c)}header span{color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}label:first-child{margin-top:0}
input,select,textarea{width:100%;background:#0d1218;color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font:inherit}
textarea{font-size:12px;min-height:110px;resize:vertical}
button{background:#202a37;color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--mu)}button.go{background:var(--c);border-color:var(--c);color:#0b0e13;font-weight:700;width:100%;padding:11px;margin-top:14px}
button:disabled{opacity:.45;cursor:default}
#drop{border:1.5px dashed var(--ln);border-radius:8px;padding:14px;text-align:center;color:var(--mu);font-size:12px;cursor:pointer}
#drop.on{border-color:var(--c);color:var(--ink)}
#refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#refs div{position:relative}#refs img{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block}

.row{display:flex;gap:8px}.row>*{flex:1}
#bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}#bar span{color:var(--mu);font-size:12px;margin-right:auto}
#jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.job{background:var(--pn);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.job .th{aspect-ratio:2/3;background:#0d1218 center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;text-align:center;padding:10px}
.job.sq .th{aspect-ratio:1}
.job .bd{padding:10px}.job h3{margin:0;font-size:13px;display:flex;gap:6px;align-items:center}.job h3 input{width:auto}

.job .st{font-size:11.5px}.st.run{color:#ffd27a}.st.ok{color:#9be23a}.st.err{color:#ff6b7d}
.job .ac{display:flex;gap:6px;margin-top:8px}.job .ac button{flex:1;padding:5px;font-size:12px}

small{color:var(--mu)}
</style></head><body>
<header><h1>SILENT <b>SIX</b> Studio</h1><span>기존 이미지를 넣으면 요원 풀세트(포즈 8컷 · 엔딩 컷 · 게임 내 스프라이트)를 한 번에 뽑는다</span></header>

</div>
<div>

</div>
</main>

function draw(){
  $('jobs').innerHTML=jobs.map(function(j,i){return '<div class="job'+(j.sq?' sq':'')+(j.ed?' ed':'')+'"><div class="th" style="'+(j.file?'background-image:url('+j.file+')':'')+'">'+(j.file?'':j.st==='run'?'생성 중…':'아직 없음')+'</div><div class="bd"><h3><input type="checkbox" data-i="'+i+'" '+(j.on?'checked':'')+'>'+j.t+'</h3><p>'+j.s+'</p><div class="st '+j.st+'">'+(j.st==='run'?'생성 중…':j.msg||j.name+'.png')+'</div><div class="ac"><button data-r="'+i+'"'+(j.st==='run'?' disabled':'')+'>'+(j.file?'다시 뽑기':'뽑기')+'</button><button data-e="'+i+'">프롬프트</button></div><textarea data-p="'+i+'">'+j.prompt.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></div></div>';}).join('');
  var n=jobs.filter(function(j){return j.st==='ok';}).length;$('sum').textContent=C[$('char').value].n+' — '+n+' / '+jobs.length+'컷 완료'+(running?' · 생성 중 '+running+'건':'');
}
$('jobs').addEventListener('click',function(e){var t=e.target,d=t.dataset;if(d.r!==undefined){enq([+d.r]);}else if(d.e!==undefined){jobs[+d.e].ed=!jobs[+d.e].ed;draw();}});
$('jobs').addEventListener('change',function(e){var d=e.target.dataset;if(d.i!==undefined)jobs[+d.i].on=e.target.checked;if(d.p!==undefined)jobs[+d.p].prompt=e.target.value;});
function enq(list){
  if(!$('key').value.trim()){alert('API 키를 넣어 주세요.');return;}
  if(!refs.length&&!confirm('참고 이미지가 없습니다. 얼굴이 기존 캐릭터와 달라질 수 있어요. 그대로 진행할까요?'))return;
  ls('s6key',$('key').value.trim());ls('s6model',$('model').value.trim());ls('s6q',$('quality').value);
  list.forEach(function(i){var j=jobs[i];if(j.st!=='run'&&queue.indexOf(j)<0){j.st='run';j.msg='';queue.push(j);}});draw();pump();
}
function pump(){
  var max=+$('conc').value;
  while(running<max&&queue.length){(function(j){running++;
    var body={key:$('key').value.trim(),model:$('model').value.trim(),quality:$('quality').value,size:j.size,prompt:j.prompt,char:j.name.replace(/^s_/,'').split('_')[0],name:j.name,refs:j.spr?refs.slice(0,2).concat(sref):refs};
    if(j.spr&&$('sbg').value)body.background=$('sbg').value;
    fetch('/api/gen',{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){if(d.ok){j.st='ok';j.msg='저장됨';j.file=d.file;j.on=false;}else{j.st='err';j.msg=d.error;}}).catch(function(e){j.st='err';j.msg=''+e;}).then(function(){running--;draw();pump();});
  })(queue.shift());}
  draw();
}
function addFiles(fs,arr,box,one){[].forEach.call(fs,function(f){var r=new FileReader();r.onload=function(){if(one)arr.length=0;arr.push(r.result);showRefs(arr,box);};r.readAsDataURL(f);});}
function showRefs(arr,box){$(box).innerHTML=arr.map(function(u,i){return '<div><img src="'+u+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px"><b data-x="'+i+'">×</b></div>';}).join('');}
[['drop','file',refs,'refs',false],['drop2','file2',sref,'refs2',true]].forEach(function(a){
  var dz=$(a[0]),fi=$(a[1]);dz.onclick=function(){fi.click();};fi.onchange=function(){addFiles(fi.files,a[2],a[3],a[4]);fi.value='';};
  dz.ondragover=function(e){e.preventDefault();dz.className='on';};dz.ondragleave=function(){dz.className='';};dz.ondrop=function(e){e.preventDefault();dz.className='';addFiles(e.dataTransfer.files,a[2],a[3],a[4]);};
  $(a[3]).onclick=function(e){var x=e.target.dataset.x;if(x!==undefined){a[2].splice(+x,1);showRefs(a[2],a[3]);}};
});
$('go').onclick=function(){var l=[];jobs.forEach(function(j,i){if(j.on)l.push(i);});if(!l.length){alert('뽑을 컷을 선택해 주세요.');return;}enq(l);};
$('all').onclick=function(){jobs.forEach(function(j){j.on=true;});draw();};$('none').onclick=function(){jobs.forEach(function(j){j.on=false;});draw();};
$('open').onclick=function(){fetch('/api/open',{method:'POST',body:'{}'});};
$('zip').onclick=function(){fetch('/api/zip',{method:'POST',body:JSON.stringify({char:$('char').value})}).then(function(r){return r.json();}).then(function(d){alert('ZIP 저장: '+d.path);});};
$('char').onchange=function(){refs.length=0;showRefs(refs,'refs');build();};
build();
</script></body></html>
