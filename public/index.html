<!DOCTYPE html>
<html lang="ko">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="favicon.png"><meta name="theme-color" content="#06080b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SILENT SIX">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<title>SILENT SIX — 프로토타입</title>
<style>
:root{--c:#ff3b52;--g:rgba(255,59,82,.45);--ink:#ece8e1;--dim:#7f8b97;--bg:#0a0e13;--tile:#151c24;--cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
html,body{margin:0;height:100%;background:#06080b;color:var(--ink);font-family:"Barlow Condensed","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;position:relative}
#top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px 22px;background:linear-gradient(rgba(6,8,11,.92),rgba(6,8,11,0));pointer-events:none}
#top small{display:block;font-size:10px;font-weight:600;letter-spacing:.32em;color:var(--c)}
#top small::before{content:"";display:inline-block;width:6px;height:6px;background:var(--c);transform:rotate(45deg);margin:0 8px 1px 2px}
#obj{font-size:17px;font-weight:700;letter-spacing:.01em;margin-top:2px}
#time{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink)}
#wrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:var(--ink);border:0;background:var(--tile);font-weight:700;padding:0;border-radius:0;clip-path:var(--cut)}
#panel{background:linear-gradient(#0d1218,#080b0f);border-top:2px solid var(--c);padding:9px 10px 10px;position:relative}
#panel::before{content:"";position:absolute;right:14px;top:-6px;width:9px;height:9px;background:var(--c);transform:rotate(45deg)}
#info{min-height:62px;padding:0 2px 8px}
.role{font-size:10.5px;font-weight:600;letter-spacing:.3em;color:var(--dim)}
.role b{color:var(--c);font-weight:700}
.an{display:flex;align-items:baseline;gap:8px;margin:1px 0 2px}
.an b{font-size:25px;font-weight:800;line-height:1.05;color:var(--c);letter-spacing:-.01em}
.an em{font-style:normal;font-size:13px;font-weight:600;letter-spacing:.3em;color:var(--dim)}
#info p{margin:0;font-size:12.5px;line-height:1.3;color:#b9c2cb;font-weight:500;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#acts{display:flex;gap:4px;margin-bottom:6px}
.ab{flex:1;min-width:0;height:58px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:6px;font-size:11px;font-weight:700;white-space:nowrap;color:#aab4be}
.ab svg,.sb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ab s{position:absolute;left:6px;top:4px;text-decoration:none;font-size:9.5px;font-weight:600;letter-spacing:.08em;opacity:.45}
.ab u{position:absolute;right:5px;top:3px;text-decoration:none;font-size:12px;font-weight:700;color:var(--c)}
.ab.sel{background:var(--c);color:#0a0d11}
.ab.sel u{color:#0a0d11}.ab.sel s{opacity:.7}
.ab:active,.sb:active{filter:brightness(1.3)}
#cards{display:flex;gap:4px;height:84px}
.card{flex:1;min-width:0;position:relative;background-size:cover;background-position:50% 8%;background-color:#11161c;text-align:left;--c:#ff3b52;filter:grayscale(.85) brightness(.55)}
.card.vi{--c:#b98cff}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,11,15,0) 35%,rgba(8,11,15,.95))}
.card .cn{position:absolute;left:9px;bottom:17px;z-index:1;font-size:24px;font-weight:700;line-height:1;letter-spacing:.05em;color:#fff}
.card .cs{position:absolute;left:9px;bottom:6px;z-index:1;font-size:10px;font-weight:600;color:#c3cbd3;white-space:nowrap;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.card .cr{position:absolute;left:9px;top:7px;z-index:1;font-size:9.5px;font-weight:600;letter-spacing:.28em;color:#fff;opacity:.75}
.card.sel{filter:none;box-shadow:inset 0 0 0 2px var(--c),inset 0 -5px 0 var(--c)}
.card.sel .cn{color:var(--c)}
.sys{display:flex;gap:4px;flex:0 0 auto}
.sys>div{display:flex;flex-direction:column;gap:4px}
.sb{width:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#aab4be}
.sb.pl{height:84px;width:58px;color:var(--ink)}
.sb.sm{height:40px;flex-direction:row;gap:5px;width:64px}
.sb.sm svg{width:16px;height:16px}
.sb.go{background:var(--ink);color:#0a0d11}
#ov{position:absolute;inset:0;background:rgba(6,8,11,.95);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:5;overflow:auto}
#app.pre #panel,#app.pre #top{display:none}
#ov.hide{display:none}
#card{max-width:360px;width:100%;position:relative;margin:auto}
#ovi{display:block;width:100%;height:210px;object-fit:cover;object-position:50% 7%;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);margin-bottom:12px;background:#11161c}
#ovi.hide{display:none}
#card h2{margin:0 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.34em;color:var(--c);text-transform:uppercase}
#card h2::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);transform:rotate(45deg);margin:0 9px 1px 2px}
#card h1{margin:0 0 10px;font-size:46px;font-weight:700;line-height:.95;letter-spacing:.03em;padding-bottom:10px;border-bottom:1px solid #26303a}
#card p{margin:0 0 8px;font-size:14px;line-height:1.5;color:#cfd3d8;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#card ul{margin:0 0 14px;padding-left:16px;font-size:12.5px;line-height:1.55;color:#a2abb5;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#card ul li::marker{color:var(--c)}
#ovb{display:flex;gap:6px}
#ovb button{flex:1;min-height:52px;font-size:16px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px}
#ovb button b{font-size:26px;font-weight:700;opacity:.55}
#ovb button.go{background:var(--ink);color:#0a0d11}
@media (orientation:landscape) and (max-height:520px){
 #app{flex-direction:row}
 #panel{width:268px;border-top:0;border-left:2px solid var(--c);display:flex;flex-direction:column;justify-content:flex-start;overflow:auto;padding:10px}
 #panel::before{display:none}
 #acts{flex-wrap:wrap}.ab{flex:1 0 28%;height:50px}
 #cards{flex-wrap:wrap;height:auto}.card{flex:1 0 40%;height:70px}.sys{flex:1 0 100%}.sb.pl{height:40px;flex:1;flex-direction:row;gap:6px}.sb.sm{flex:1}.sys>div{flex-direction:row;flex:2}
 #ovi{height:120px}#card h1{font-size:34px}
}

#ovb.col{flex-direction:column}
#ovb.col button{justify-content:flex-start;padding:0 16px;min-height:46px}
#dlg{position:fixed;inset:0;z-index:12;background:linear-gradient(180deg,rgba(6,8,11,.55) 0%,rgba(6,8,11,.2) 35%,rgba(6,8,11,.9) 78%);overflow:hidden;--c:#ff3b52}
#dlg.hide{display:none}
#dlg img{position:absolute;bottom:17vh;height:66vh;max-width:62vw;object-fit:contain;object-position:bottom;transition:filter .2s,transform .2s,opacity .2s;filter:brightness(.38) saturate(.6);transform:scale(.96);transform-origin:bottom}
#dlg img.card{width:46vw;height:56vh;object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
#dlg img.on{filter:none;transform:none}
#dlg img.off{opacity:0}
#dgl{left:-3vw}#dgr{right:-3vw}
#dgb{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:#06080b;border-top:2px solid var(--c);min-height:19vh}
#dgn{display:block;font-size:13px;letter-spacing:.14em;color:var(--c);margin-bottom:8px}
#dgt{margin:0;font-size:16px;line-height:1.6;color:#ece8e1;word-break:keep-all;min-height:4.8em}
#dgf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#8a96a3}
#dgs{background:none;border:1px solid #3a424c;color:#c9d2dc;font-size:12px;padding:6px 12px;border-radius:2px}
#sc{position:fixed;inset:0;z-index:9;background:#06080b;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;--c:#ff3b52}
#sc.hide{display:none}
#sci{position:absolute;left:0;top:0;width:100%;height:78%;object-fit:cover;object-position:50% 12%;opacity:0;transform:scale(1.06);transition:opacity .7s,transform 6s linear}
#sci.on{opacity:.9;transform:scale(1)}
#sc::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,8,11,.1) 32%,rgba(6,8,11,.97) 70%)}
#scb{position:relative;z-index:1;padding:20px 20px 26px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
#sck{font-size:11.5px;letter-spacing:.34em;font-weight:600;color:var(--c)}
#sck::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);transform:rotate(45deg);margin:0 9px 1px 2px}
#sch{font-size:42px;line-height:1.08;font-weight:800;margin:8px 0 12px;letter-spacing:-.01em;border-left:3px solid var(--c);padding-left:12px}
#scp{font-size:14.5px;line-height:1.55;color:#cfd3d8;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;min-height:46px}
#scp .tg{display:block;color:var(--c);font-size:17px;line-height:1.35;margin-bottom:8px}
#scn{display:flex;gap:6px;margin-top:18px}
#scn button{flex:1;min-height:50px;font-size:15px;font-weight:700;letter-spacing:.06em}
#scn button.go{background:var(--ink);color:#0a0d11}
#scn button+button{flex:0 0 110px;color:#9aa3ad}
#scn button.bk{flex:0 0 76px;color:var(--ink)}
#scn button.bk+button.go{flex:1;color:#0a0d11}
#card ul b{color:var(--c)}
@media (orientation:landscape) and (max-height:520px){#sci{height:100%;width:55%;left:auto;right:0}#sc::after{background:linear-gradient(90deg,rgba(6,8,11,.98) 48%,rgba(6,8,11,.2))}#sch{font-size:30px}#scb{margin:0;max-width:52%}}

#op{position:fixed;inset:0;z-index:11;background:#06080b;overflow:hidden;--c:#ff3b52}
#op.hide{display:none}
#op img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;animation:kb 4.4s ease-out both}
@keyframes kb{from{transform:scale(1.3);filter:grayscale(1) brightness(.45)}35%{filter:grayscale(.15) brightness(.8)}to{transform:scale(1.03);filter:grayscale(0) brightness(.85)}}
#op .sh{position:absolute;inset:0;background:linear-gradient(rgba(6,8,11,.05) 30%,rgba(6,8,11,.96) 84%)}
#op .sl{position:absolute;inset:0;background:var(--c);animation:wipe .75s cubic-bezier(.75,0,.2,1) both}
@keyframes wipe{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}
#op .tx{position:absolute;left:20px;right:20px;bottom:92px}
#op .k{font-size:11.5px;font-weight:600;color:var(--c);letter-spacing:.42em;animation:kin .7s .35s both}
@keyframes kin{from{opacity:0;letter-spacing:1.1em}to{opacity:1;letter-spacing:.42em}}
#op h1{margin:10px 0 0;font-size:56px;line-height:1.1;font-weight:800;letter-spacing:-.025em;border-left:4px solid var(--c);padding-left:14px}
#op h1 span{display:block;overflow:hidden}
#op h1 i{display:block;font-style:normal;animation:up .75s cubic-bezier(.2,.85,.2,1) both}
@keyframes up{from{transform:translateY(112%)}to{transform:none}}
#op .pg{position:absolute;left:20px;right:20px;bottom:64px;height:2px;background:rgba(255,255,255,.16)}
#op .pg b{display:block;height:100%;background:var(--c);transform-origin:0 50%;animation:pgr 3.4s linear both}
@keyframes pgr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#op .no{position:absolute;left:20px;bottom:26px;font-size:13px;letter-spacing:.3em;color:#8a96a3;font-weight:600}
#op .sk{position:absolute;right:16px;bottom:16px;width:96px;height:38px;font-size:12px;color:#9aa3ad}
#op.tt img{opacity:.35;animation-duration:9s}
#op.tt .tx{bottom:auto;top:50%;transform:translateY(-50%)}
#op.tt h1{font-size:min(104px,20vw);line-height:.9;letter-spacing:.02em;border:0;padding:0}
#op.tt h1 span{display:flex}
#op.tt h1 span+span{color:var(--c)}
#op.tt p{margin:18px 0 26px;font-size:17px;color:#cfd3d8;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;animation:kin 1s 1.2s both;letter-spacing:.42em}
#opgo{width:100%;max-width:320px;height:54px;font-size:16px;letter-spacing:.08em;background:var(--ink);color:#0a0d11;animation:up .6s 1.5s both}
#op .cut{position:absolute;inset:0;overflow:hidden;background:#06080b;--c:#ff3b52}
#op .cut .sk2{position:absolute;inset:-14px}
#op .cut .im{position:absolute;inset:0;will-change:transform;transform-origin:50% 30%}
#op .cut img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;animation:none;opacity:1}
#op .cut .ly{position:absolute;inset:0;pointer-events:none}
#op>.sk{z-index:5;background:rgba(6,8,11,.5)}
/* OFF DUTY */
#op .sx{animation:dis .4s ease both}
@keyframes dis{from{opacity:0}to{opacity:1}}
#op .sx img.b{filter:saturate(1.3) contrast(1.05) brightness(1.07)}
#op .sx img.g{filter:blur(16px) saturate(1.7) brightness(1.25);opacity:.4;mix-blend-mode:screen}
#op .sx .tone{background:linear-gradient(165deg,rgba(255,110,170,.5),rgba(130,90,255,.3) 55%,rgba(10,6,24,.75));mix-blend-mode:soft-light}
#op .sx .vg{background:radial-gradient(ellipse at 50% 38%,transparent 42%,rgba(8,4,16,.72) 100%)}
#op .sx .leak{inset:-30%;background:linear-gradient(105deg,transparent 42%,rgba(255,215,190,.42) 50%,transparent 58%);mix-blend-mode:screen;animation:leak var(--d) ease-in-out both}
@keyframes leak{from{transform:translateX(-55%)}to{transform:translateX(55%)}}
#op .gr{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");opacity:.16;mix-blend-mode:overlay;animation:grn .5s steps(4) infinite}
@keyframes grn{0%{background-position:0 0}25%{background-position:-40px 30px}50%{background-position:25px -50px}75%{background-position:-60px -20px}}
#op .c-tilt .im{animation:tilt var(--d) cubic-bezier(.35,0,.25,1) both}
@keyframes tilt{from{transform:scale(1.95) translateY(-21%)}to{transform:scale(1.5) translateY(11%)}}
#op .c-tiltd .im{animation:tiltd var(--d) cubic-bezier(.35,0,.25,1) both}
@keyframes tiltd{from{transform:scale(1.7) translateY(14%)}to{transform:scale(1.6) translateY(-12%)}}
#op .c-push .im{animation:push var(--d) ease-out both}
@keyframes push{from{transform:scale(1.06) rotate(-1.4deg)}to{transform:scale(1.34) rotate(.7deg) translateY(3%)}}
#op .c-drift .im{animation:drift var(--d) ease-in-out both}
@keyframes drift{from{transform:scale(1.45) translate(-6%,5%)}to{transform:scale(1.45) translate(6%,-2%)}}
#op .sx .bw{position:absolute;left:-2%;right:-30%;top:38%;font:italic 400 31vw/1 "Snell Roundhand","Dancing Script","Brush Script MT",cursive;color:#fff;opacity:.3;white-space:nowrap;mix-blend-mode:overlay;animation:bw var(--d) linear both}
@keyframes bw{from{transform:translateX(6%) rotate(-6deg)}to{transform:translateX(-10%) rotate(-6deg)}}
#op .sx .tx2{position:absolute;left:22px;right:22px;bottom:84px}
#op .sx .tx2 b{display:block;font-size:13px;letter-spacing:.5em;font-weight:600;color:#fff;opacity:.85;animation:kin .8s .15s both}
#op .sx .tx2 em{display:block;margin-top:8px;font:800 34px/1.15 "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-style:normal;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 18px rgba(20,0,30,.6);animation:fup .7s .3s both}
@keyframes fup{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
#op .pl{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#op .pl-g{background:linear-gradient(180deg,#6f8fe8,#c08af0 70%,#f3a0c8)}
#op .pl-g h2{margin:0;font:italic 400 30vw/0.9 "Snell Roundhand","Dancing Script","Brush Script MT",cursive;color:#fff;opacity:.55;animation:pgz var(--d) ease-out both}
#op .pl-g h3{margin:-9vw 0 0;font-size:20vw;line-height:.9;font-weight:800;color:#0b0d14;letter-spacing:.01em;animation:slam .28s cubic-bezier(.2,.9,.2,1) both}
@keyframes pgz{from{transform:scale(1.25) rotate(-8deg)}to{transform:scale(1) rotate(-8deg)}}
@keyframes slam{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
/* ON MISSION */
#op .tc img.b{filter:grayscale(.4) contrast(1.2) brightness(1.4)}
#op .tc img.g{filter:grayscale(1) contrast(1.5) sepia(1) hue-rotate(-50deg) saturate(6);mix-blend-mode:screen;opacity:0;animation:rgb var(--d) steps(1) both}
@keyframes rgb{0%{transform:translate(16px,-4px);opacity:.75}9%{transform:translate(-10px,3px);opacity:.55}18%{transform:translate(5px,0);opacity:.4}26%,100%{transform:none;opacity:0}}
#op .tc .tone{background:linear-gradient(rgba(120,160,210,.28),rgba(30,45,70,.4));mix-blend-mode:multiply}
#op .tc .wash{background:var(--c);mix-blend-mode:overlay;opacity:.3}
#op .tc .scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
#op .tc .vg{background:radial-gradient(ellipse at 50% 40%,transparent 42%,rgba(2,5,10,.62) 100%)}
#op .tc .sk2{animation:shk .42s steps(1) both}
@keyframes shk{0%{transform:translate(-9px,6px)}14%{transform:translate(8px,-7px)}28%{transform:translate(-6px,-3px)}42%{transform:translate(4px,4px)}56%{transform:translate(-2px,1px)}70%,100%{transform:none}}
#op .c-snap .im{animation:snap var(--d) cubic-bezier(.08,.9,.15,1) both}
@keyframes snap{0%{transform:scale(2.5)}22%{transform:scale(1.2)}100%{transform:scale(1.3)}}
#op .c-whip .im{animation:whip var(--d) cubic-bezier(.1,.85,.2,1) both}
@keyframes whip{0%{transform:translateX(60%) scale(1.45);filter:blur(12px)}24%{transform:translateX(-3%) scale(1.32);filter:blur(0)}100%{transform:translateX(2%) scale(1.32)}}
#op .c-whipl .im{animation:whipl var(--d) cubic-bezier(.1,.85,.2,1) both}
@keyframes whipl{0%{transform:translateX(-60%) scale(1.45);filter:blur(12px)}24%{transform:translateX(3%) scale(1.32);filter:blur(0)}100%{transform:translateX(-2%) scale(1.32)}}
#op .c-tupf .im{animation:tupf var(--d) cubic-bezier(.1,.85,.2,1) both}
@keyframes tupf{0%{transform:scale(2) translateY(-22%);filter:blur(8px)}30%{transform:scale(1.6) translateY(9%);filter:blur(0)}100%{transform:scale(1.52) translateY(12%)}}
#op .c-nv img.b{filter:grayscale(1) contrast(1.6) brightness(1.15) sepia(1) hue-rotate(65deg) saturate(3.2)}
#op .c-nv .wash{opacity:0}
#op .tc .hud{font-size:10px;letter-spacing:.22em;color:#dfe6ee;font-weight:600}
#op .tc .hud i{position:absolute;font-style:normal}
#op .tc .hud i:nth-child(1){left:16px;top:16px}
#op .tc .hud i:nth-child(1):before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b52;margin-right:7px;animation:blk .5s steps(1) infinite}
@keyframes blk{50%{opacity:0}}

 {t:'얼음 위의 선물',copy:'숨을 곳이<br>없는 밤.',pre:'22:30, 얼어붙은 호수. 산타의 상자를 본 증인이 건너편 보트하우스에 갇혀 있다. 다쳤고, 오래 못 버틴다. 구급 가방은 얼음 위 붉은 오두막에 있다. 부두의 안테나를 끊으면 탐조등이 멈춘다. 얼음 위는 눈보라가 칠 때 건넌다.',post:['증인은 제 발로 걸어 나왔다.', '산타는 헬리오스 사람이 아니라 제6과 출신이다. 다음은 자정, 대성당.'],bc:'onesnipe',img:'a_viper_5.jpg',par:540,env:{blizzard:[26,9]},tips:["<b>눈보라</b>: 26초마다 9초 동안 모두의 시야가 절반 아래로 줄어든다. 얼음 위는 그때 오두막에서 오두막으로 건넌다.", "<b>탐조등</b>은 얼음 위를 훑는다. 오두막 뒤에만 그늘이 진다. 바이퍼가 <b>안테나</b>를 쏘면 탐조등이 한 방향으로 멈춘다.", "<b>구급 가방</b>은 얼음 한가운데 붉은 오두막에 있다. 닥이 챙겨야 증인을 치료할 수 있다.", "치료한 뒤에는 <b>증인이 닥을 따라온다</b>. 증인은 앉지 못해서 멀리서도 보인다."],

   start:[['hq','22시 30분, 호수다. 산타의 상자를 직접 본 사람이 보트하우스에 갇혀 있다. 다쳤고, 오래 못 버틴다.'],['doc','다쳤다고? 그럼 얘기 끝났네. 내가 들어가서 걷게 만들어 올게.',1],['viper','얼음 위는 숨을 데가 없는데. 오두막 몇 채가 전부야. 건너다 걸리면 그대로 표적이지.',0],['doc','그래서 네가 있는 거잖아. 부두 안테나부터 끊어 줘. 무전만 죽이면 탐조등도 멍청해져.',0],['viper','한 발이면 돼. …근데 닥, 구급 가방은?',2],['doc','아, 그게 문제야. 급하게 나오느라 큰 가방을 못 챙겼어. 저 붉은 오두막에 하나 있을 거야.',2]],
   mid:[['santa','그 사람은 왜 살리려고? 내 얘기가 그렇게 듣고 싶어?'],['viper','어머, 목소리 좋네. 직접 와서 들려주지 그래?',2],['santa','바이퍼구나. 넌 여전히 쏘기 전에 말이 많아.'],['viper','…나 알아?',1],['doc','바이퍼, 대꾸하지 마. 저 사람, 우리 의무 기록까지 읽은 말투야.',1]],
   obj:[['witness','그 여자… 헬리오스 사람이 아니야. 걷는 거, 숨는 거, 전부 당신들이랑 똑같았어.',0],['doc','천천히 말해요. 우리랑 똑같다는 게 무슨 뜻이에요?',1],['witness','6과. 그 여자가 자기 입으로 그랬어. "난 거기서 나왔다"고.',1],['santa','입이 가벼운 사람은 오래 못 사는데. 조심히 데려가, 닥.']],
   end:[['viper','6과 출신이라… 그럼 우리 선배네. 인사라도 할 걸 그랬나.',2],['doc','웃을 일이 아니야. 선배가 왜 헬리오스 물건을 나르고 있는 건데.',1],['viper','글쎄. 배신했거나, 배신한 척하거나. 둘 중 하나겠지.',0],['doc','증인이 그러는데, 세 번째 상자는 벌써 떠났대. 자정 미사가 열리는 대성당으로.',0]]},

 {t:'자정 미사',copy:'헌금은<br>우리가 걷는다.',pre:'자정, 대성당. 세 번째는 상자가 아니라 돈가방이다. 제단 옆 헌금함에 들어 있다. 열쇠는 고해소 앞의 부제가 갖고 있다. 미사 중이라 소리를 낼 수 없다. 종지기 방의 줄을 당기면 종이 울리는 동안은 소리가 묻힌다.',post:['가방을 바꿔 놓았다.', '산타는 헬리오스의 돈도 빼돌리고 있다. 추적기는 사설 비행장에서 멈췄다.'],bc:'ghost2',img:'a_mirage_5.jpg',par:480,tips:["<b>신도석</b>은 넘을 수 없다. 줄 사이로 앉아서 지나가면 멀리서는 안 보인다.", "<b>종 줄</b>을 당기면 15초 동안 종이 울린다. 그동안은 발소리도 제압 소리도 묻힌다. 언제 당길지는 직접 정한다.", "<b>부제</b>는 종이 울리지 않을 때 쓰러뜨리면 주변 경비가 소리를 듣는다.", "가방을 바꾸면 미사가 끝난다. 신도들이 일어나 <b>가운데 통로</b>를 막고, 경비가 정문 셋을 지킨다. <b>납골당 통로</b>로 나간다."],

 {t:'산타의 썰매',copy:'이륙은<br>없다.',pre:'03:30, 사설 비행장. 추적기가 여기서 멈췄다. 격납고의 전용기가 뜨기 전에 화물을 확보한다. 격납고는 잠겨 있다. 관제탑, 급수탑, 연료 밸브 셋 중 둘을 해야 열린다. 시간은 5분.',post:['화물칸은 비어 있었다.', '산타는 처음부터 제6과가 자기를 쫓게 만들었다. 카드에는 다음에 만날 좌표가 적혀 있다.'],bc:'nogun',img:'a_raven_6.jpg',endImg:'w5_end_a.jpg',par:420,env:{limit:300},tips:["셋이 갈라진다. <b>관제탑</b>은 글리치(시간 +2분), <b>급수탑</b>은 바이퍼(탐조등 정지), <b>연료 밸브</b>는 레이븐(시간 +1분). 셋 중 둘이면 격납고가 열린다.", "<b>탐조등</b>은 계류장을 훑는다. 차량과 컨테이너 뒤에만 그늘이 진다.", "화물칸을 열면 전용기가 움직인다. <b>2분</b> 안에 셋 다 들어온 곳으로 나간다."],

var NOVEL={pro:{t:'지워진 여섯',sub:'PROLOGUE',img:'a_raven_7.jpg',p:[
 '제6과에는 간판이 없다. 예산서에는 "기타 운영비"라고 적히고, 조직도에는 5과 다음이 바로 7과다. 그 빈칸에 여섯 명이 있다.',
 '여섯은 서로를 고른 적이 없다. 한 사람이 골랐다. 사람들은 그를 설계자라고 불렀다. 그는 여섯에게 같은 말을 했다. "너는 이미 죽은 사람이다. 그러니 죽을 걱정 없이 일할 수 있다."',
 '여섯은 그 말이 위로인 줄 알았다. 경고였다는 건 설계자가 사라지고 3년이 지나서야 알게 된다.',
 '상대는 헬리오스다. 겉은 민간 경비 회사고, 속은 남부 회랑의 전쟁에 무기와 정보를 대는 중개상이다. 제6과는 그 회사를 소리 없이 깎아 내는 부서였다. 3년 전 폐광 작전에서 한 명을 잃은 뒤로 제6과는 멈췄고, 여섯은 흩어졌다.',
 '그리고 지금. 총선을 앞두고 남부 회랑 청문회가 열린다. [[같은 달에 제6과의 명단이 헬리오스로 넘어갔다.]] 여섯의 본명, 얼굴, 가족.',
 '흩어진 여섯 가운데 아직 현장에 남은 사람은 하나뿐이다.']},
ch:[
{t:'항구 3번 창고',pre:[
 '레이븐은 3년 동안 혼자 일했다. 명령이 오면 하고, 안 오면 기다렸다. 그날 온 명령은 짧았다. 항구 창고에 잡힌 연락책을 데려올 것.',
 '연락책은 제6과 사람이 아니다. 누군가 헬리오스 안에 심어 둔 회계 직원이다. 왜 그 사람을 구해야 하는지 레이븐은 묻지 않았다. 묻지 않는 게 3년 동안 살아남은 방법이었다.',
 '창고에는 경비병이 여섯. 지원은 없다. 들어간 적 없는 걸로 해야 한다.'],post:[
 '창고 밖에서 연락책은 한참 숨을 골랐다. 그러고는 고맙다는 말 대신 이렇게 말했다. "명단이 팔렸습니다. 여섯 명 전부요. 당신도 있어요."',
 '레이븐은 믿지 않았다. 죽은 사람의 명단은 팔 수 없다고 생각했다. 연락책이 레이븐의 본명을 입에 올리기 전까지는.',
 '[[그 이름을 소리로 들은 건 9년 만이었다.]]'],q:'죽은 사람으로 처리된 여섯의 본명을 아는 사람은 몇 명인가.'},
{t:'산길 통신 기지',pre:[
 '명단은 한 번에 넘어가지 않았다. 판 쪽이 값을 다 받을 때까지 절반만 보냈기 때문이다. 나머지 절반이 산길 통신 기지의 중계 장비를 지나고 있다.',
 '레이븐은 바이퍼를 찾아갔다. 바이퍼는 사격장 관리인으로 살고 있었다. 돌아올 이유가 없다고 했다. 명단 얘기를 듣고는 한참 있다가 물었다. "그 명단에 내 관측수 이름도 있어?"',
 '없었다. 그 사람은 여섯이 아니니까. 바이퍼는 그 대답을 듣고 총을 챙겼다. 안도해서가 아니었다. 그렇다면 그가 지금 어느 편에 서 있는지 알 것 같아서였다.',
 '탑 위의 초병은 바이퍼 몫이다. 레이븐은 아래로 들어간다.'],post:[
 '장비는 끊었다. 그러나 전송 기록을 보니 [[앞의 절반은 이미 도착해 있었다.]]',
 '바이퍼는 능선에서 내려오며 탄 한 발을 주머니에 넣었다. 언제나 한 발은 남겨서 돌아온다. 누구에게 쓸 한 발인지는 말하지 않는다.'],q:'먼저 넘어간 절반에 누가 들어 있는가.'},
{t:'위장 법인 사무실',pre:[
 '누가 샀는지 알려면 헬리오스의 서버를 봐야 한다. 그 서버의 물류 프로그램을 짠 사람이 글리치다. 스무 살 때 외주로 받은 일이었다. 무엇을 실어 나르는 프로그램인지는 나중에 알았다.',
 '글리치는 처음에 거절했다. 자기가 지운 이름이 그 명단에 있다는 말을 듣고도 웃었다. "지운 이름을 어떻게 팔아요."',
 '레이븐은 대답 대신 접속 권한 목록을 보여 줬다. 글리치의 옛 계정이 살아 있었다. 누군가 글리치의 손버릇을 흉내 내 그 서버에 드나들고 있었다. 글리치는 웃음을 거두고 헤드폰을 목에 걸었다.',
 '서버실까지 카메라가 석 대다. 글리치가 눈을 맡는다.'],post:[
 '서버에서 나온 구매 기록은 이상했다. 대금이 돈이 아니었다. 폐광에 쌓아 둔 무기 한 창고였다. 그리고 [[판 사람의 계정은 헬리오스 바깥, 정부 망에서 들어온 것이었다.]]',
 '로그 끝에 주석 한 줄이 남아 있었다. 변수 이름 짓는 버릇도, 줄 바꾸는 자리도 글리치와 똑같았다. "아직도 사탕 물고 일해?"',
 '글리치는 입에 문 사탕을 깨물어 부쉈다. 그 줄을 지우지 않고 창을 닫았다.'],q:'정부 망 안에서 누가 무기를 값으로 받는가.'},
{t:'폐광',pre:[
 '폐광은 레이븐에게 3년 전 그 자리다. 레이븐은 이 판에 들어가지 않는다. 이유는 말하지 않았고 아무도 묻지 않았다. 대신 바이퍼가 브릭을 데리러 갔다.',
 '브릭은 채석장에서 발파 일을 하고 있었다. 설명은 길게 필요 없었다. "헬리오스 창고"라는 말에서 이미 일어섰다. 브릭의 옛 분대는 남부 회랑의 벙커에 갇혔고 전원 사망으로 처리됐다. 문을 막은 폭약은 헬리오스의 물건이었다.',

      var pm=(gh.cam||(gh.lamp&&acts.indexOf('hack')>=0))?(acts.indexOf('hack')>=0?'hack':null):acts.indexOf('ko')>=0&&!gh.tower&&!gh.boss?'ko':acts.indexOf('dart')>=0&&!gh.boss?'dart':acts.indexOf('snipe')>=0?'snipe':null;
      if(!pm){say(gh.cam?'카메라는 해킹하거나 쏴야 한다 — 아래에서 행동을 고르세요':'아래에서 공격 행동을 고르세요');return;}
      md=pm;
    }else if(bh&&acts.indexOf('carry')>=0){md='carry';}
    else if(M.subs&&M.subs.some(function(sb,si){if((sb.use||sb.shoot)&&!S.subs[si]&&cx>=sb.x&&cx<sb.x+(sb.w||1)&&cy>=sb.y&&cy<sb.y+(sb.h||1)){issue(A,{type:'sub',i:si});return true;}return false;})){return;}
    else if(M.objective&&!S.objDone&&cx===M.objective.x&&cy===M.objective.y){
      if(M.objective.by&&M.objective.by!==A.id){say(M.objective.verb+'는 '+OPD[M.objective.by].n+'만 할 수 있다');return;}
      issue(A,{type:'sab'});return;
    }
  }
  if(md==='move'||md==='run'){
    act=mv();if(!act)return;
  }else if(md==='ko'||md==='knife'){
    if(!gh){act=mv();if(!act)return;}else
    if(gh.tower){say('탑 위는 손이 닿지 않는다. 총알만 닿는다.');return;}else
    if(gh.cam){say('카메라는 기절하지 않는다. 끄거나, 쏘거나.');return;}else
    if(gh.boss){say('워든은 손으로 못 눕힌다. 피해 가라.');return;}else
    act={type:'ko',id:gh.id,kill:md==='knife'};
  }else if(md==='dart'){
    if(!gh){act=mv();if(!act)return;}
    else if(gh.cam){say('기계는 잠들지 않는다.');return;}
    else if(A.dart<=0){say('다트는 이제 없다.');return;}
    else act={type:'shoot',id:gh.id,w:'dart'};
  }else if(md==='snipe'||md==='pistol'){
    if(!gh){act=mv();if(!act)return;}
    else if(A[md==='pistol'?'pistol':'ammo']<=0){say('탄창이 비었다.');return;}
    else act={type:'shoot',id:gh.id,w:md==='pistol'?'pistol':'sniper'};
  }else if(md==='hack'){
    if(gh&&(gh.cam||gh.lamp))act={type:'hack',id:gh.id};
    else if(gh){say('사람은 해킹되지 않는다.');return;}
    else{act=mv();if(!act)return;}
  }else if(md==='lure'){
    if(blocked(cx,cy)){say('어디로 보낼지 바닥을 짚어라.');return;}
    act={type:'lure',x:cx,y:cy};
  }else if(md==='breach'){
    var bw=null;best=46;
    for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(cell(x,y)==='W'){q=PF(x+0.5,y+0.5);d=hyp(q[0]-ix,q[1]-(M.hts.W||22)/2-iy);if(d<best){best=d;bw=[x,y];}}
    if(bw)act={type:'breach',x:bw[0],y:bw[1]};
    else{act=mv();if(!act){say('금 간 벽을 짚어라. 주황색으로 깜빡인다.');return;}}
  }else if(md==='carry'){
    if(bh)act={type:'pick',id:bh.id};
    else{act=mv();if(!act)return;}
  }
  if(!act)return;
  issue(A,act);
}
function issue(A,act){
  if(plan){
    if(act.type==='shoot'&&act.w!=='pistol'){S.ops.forEach(function(p){if(p!==A)p.queue.forEach(function(a){if(a.type==='ko')act.link=a.id;});});}
    if(act.type==='ko'){S.ops.forEach(function(p){if(p!==A)p.queue.forEach(function(a){if(a.type==='shoot'&&a.w!=='pistol'&&a.link==null)a.link=act.id;});});}
    A.queue.push(act);
  }else{A.queue=[act];A.cur=null;A.path=[];A.aim=0;}
}
function doAct(a,v){
  if(!started||S.over)return;var A=S.ops[S.act];
  if(a==='mode')A.mode=v;
  else if(a==='op'){S.act=+v;freeCam=false;}
  else if(a==='stance'){if(plan)A.queue.push({type:'stance'});else{A.crouch=!A.crouch;if(A.crouch)A.disg=false;}}
  else if(a==='disg'){if(plan)A.queue.push({type:'disg'});else toggleDisg(A);}
  else if(a==='drop'){if(plan)A.queue.push({type:'drop'});else dropBody(A);}
  else if(a==='sab')issue(A,{type:'sab'});
  else if(a==='sub')issue(A,{type:'sub',i:+v});
  else if(a==='plan'){if(!plan){plan=true;S.ops.forEach(function(o){o.queue=[];o.cur=null;o.path=[];o.run=false;o.aim=0;});makeGhosts();}else plan=false;}
  else if(a==='cancel'){S.ops.forEach(function(o){o.queue=[];});plan=false;}
  else if(a==='save'){save();say('여기까지는 지켰다.');}
  else if(a==='load')load();
}

    pinch=dist;freeCam=true;freeT=Date.now();
  }
});
function ptrEnd(e){
